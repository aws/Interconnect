Environment:
  description: |-
    Environments define high level connection points between two providers.

    Environment resources support the following
    1. Conveying to end customers where and how two providers can be connected.
    2. Display information for describing these environments.

    Providers exchange environment information when establishing connectivity and
    this resource is provided for troubleshooting and validation purposes.
    Providers generally have a local copy of this information and do not need to
    request it when servicing requests.
  example:
    providerSites:
    - site: site
      providerId: providerId
      displayName: displayName
    - site: site
      providerId: providerId
      displayName: displayName
    apiUri: apiUri
    supportedFeatures:
    - FEATURE_TYPE_L3_BASE
    - FEATURE_TYPE_L3_BASE
    name: providers/my-provider/environments/my-environment
    environmentVisibility: ""
    deferralTimeoutHours: 0
    deferConnectionProvisioning: false
    supportedConnectionSizeMbps:
    - 0
    - 0
  properties:
    name:
      description: |-
        Identifier. Unique identifier for an Environment resource.

        Format: providers/{provider}/environments/{environment}
      type: string
    providerSites:
      description: |-
        Output only. A unique mapping between a provider and a site code.  This field should
        never contain more than 2 entries.  One entry should be a mapping
        between the server's provider ID and a site identifier, the other entry
        should be the parent provider ID and a site identifier.

        Example: [
                    {"providerId": "provider1", "site": "us-east4"},
                    {"providerId": "provider2", "site": "us-east1"},
                  ]
      items:
        $ref: "#/ProviderSites"
      readOnly: true
      type: array
    apiUri:
      description: |-
        API endpoint for communicating with the parent provider about this
        environment resource and all child resources.

        Example:
        remoteprovider.com/projects/123/locations/us-east4/
      type: string
    supportedConnectionSizeMbps:
      description: |-
        Output only. A list of Mbps connection sizes supported by all interconnects in the
        environment.
      items:
        format: int32
        type: integer
      readOnly: true
      type: array
    supportedFeatures:
      description: Output only. A list of features supported by all interconnects
        in the environment.
      items:
        $ref: "feature.yaml#/FeatureType"
      readOnly: true
      type: array
    environmentVisibility:
      allOf:
      - $ref: "#/EnvironmentVisibility"
      description: |-
        Output only. Controls the visibility of this environment in the provider's customer
        facing APIs.
      readOnly: true
    deferralTimeoutHours:
      description: |-
        The number of hours the deferring provider will wait for the remote provider
        to finalize the connection before declaring a failure.
      format: int32
      type: integer
    deferConnectionProvisioning:
      description: |-
        Indicates that the active provider should always defer connections to the
        passive provider in this environment
      type: boolean
  type: object

ProviderSites:
  description: A mapping of a provider id to their API and display names for sites.
  example:
    site: site
    providerId: providerId
    displayName: displayName
  properties:
    providerId:
      description: |-
        Which provider this site data is associated with.

        Format: providers/{provider}
      type: string
    site:
      description: A provider specific site name (e.g. us-east4).
      type: string
    displayName:
      description: A display name for the site for use in customer facing UI.
      type: string
  type: object

EnvironmentVisibility:
  description: |-
    Enum that describes the visibility of an environment.
      ENVIRONMENT_VISIBILITY_PRIVATE - A private environment has limited visibility (as jointly defined by
    providers) to an individual or small number of customers.
    ENVIRONMENT_VISIBILITY_PUBLIC - A public environment is visible to all provider customers with little to no
    restriction.
  enum:
  - ENVIRONMENT_VISIBILITY_PRIVATE
  - ENVIRONMENT_VISIBILITY_PUBLIC
  type: string

ListEnvironmentsResponse:
  description: Response for obtaining multiple environment resources.
  example:
    environments:
    - providerSites:
      - site: site
        providerId: providerId
        displayName: displayName
      - site: site
        providerId: providerId
        displayName: displayName
      apiUri: apiUri
      supportedFeatures:
      - FEATURE_TYPE_L3_BASE
      - FEATURE_TYPE_L3_BASE
      name: providers/my-provider/environments/my-environment
      environmentVisibility: ""
      deferralTimeoutHours: 0
      deferConnectionProvisioning: false
      supportedConnectionSizeMbps:
      - 0
      - 0
    - providerSites:
      - site: site
        providerId: providerId
        displayName: displayName
      - site: site
        providerId: providerId
        displayName: displayName
      apiUri: apiUri
      supportedFeatures:
      - FEATURE_TYPE_L3_BASE
      - FEATURE_TYPE_L3_BASE
      name: name
      environmentVisibility: ""
      deferralTimeoutHours: 0
      deferConnectionProvisioning: false
      supportedConnectionSizeMbps:
      - 0
      - 0
    nextPageToken: nextPageToken
  properties:
    environments:
      description: The environments from the specified provider.
      items:
        $ref: "#/Environment"
      type: array
    nextPageToken:
      description: |-
        A token, which can be sent as `page_token` to retrieve the next page.
        If this field is omitted, there are no subsequent pages.
      type: string
  type: object
  
ConfirmActivationKeyRequest:
  description: |-
    Request to confirm the validity of a activation key provided by a remote
    provider. The key should be provided in the `encodedKey` field as a base64
    encoded string.
  example:
    encodedKey: ""
  properties:
    key:
      allOf:
      - $ref: "#/ActivationKey"
      description: |-
        DEPRECATED: Use `encodedKey` instead.
        Activation key to be confirmed.
      deprecated: true
    encodedKey:
      type: string
      format: byte
      description: Base64 encoded ActivationKey to be confirmed.
  type: object

ActivationKey:
  description: |-
    The decoded activation key structure. The key is always transported as a
    base64-encoded JSON string between providers. After decoding, the `version`
    field determines which variant applies.

    All versions share a common envelope containing `version` and
    `destinationEnvironmentUri`, declared here. The remaining fields differ by
    version and are contributed by the matching `oneOf` variant.
  type: object
  required:
    - version
    - destinationEnvironmentUri
  properties:
    version:
      description: |-
        Required. The activation key version. Determines which variant
        (ActivationKeyV1 or ActivationKeyV2) applies.
      type: integer
      format: int32
    destinationEnvironmentUri:
      description: |-
        Required. The destination environment URI this activation key is
        intended for use at. Always in cleartext so the receiver can identify
        which environment (and, for version 2, which private key) to use.
      type: string
  discriminator:
    propertyName: version
    mapping:
      "1": "#/ActivationKeyV1"
      "2": "#/ActivationKeyV2"
  oneOf:
    - $ref: "#/ActivationKeyV1"
    - $ref: "#/ActivationKeyV2"

ActivationKeyV1:
  description: |-
    Version 1 activation key. All fields are present in cleartext within the
    base64-decoded JSON structure. In addition to the shared envelope fields
    (`version`, `destinationEnvironmentUri`), this variant carries the
    connection parameters directly.
  type: object
  required:
    - version
    - destinationEnvironmentUri
    - sharedConnectionUuid
    - connectionSizeMbps
    - destinationAccountId
  properties:
    version:
      description: Activation key version. Must be `1` for this variant.
      type: integer
      format: int32
      enum: [1]
    sharedConnectionUuid:
      description: |-
        Required. The UUID assigned to this connection to be used by both
        services.
      type: string
    connectionSizeMbps:
      description: Required. Size of the connection to be provisioned in Mbps.
      type: integer
      format: int32
    destinationAccountId:
      description: |-
        Required. User supplied account id/number on the destination CSP.
        Receiving service MUST verify that the activation key was provided
        from an authorized user of this account.
      type: string

ActivationKeyV2:
  description: |-
    Version 2 activation key. Sensitive fields are encrypted using the
    destination environment's public key. Only the shared envelope fields
    (`version`, `destinationEnvironmentUri`) remain in cleartext to enable
    routing and key selection for decryption.
  type: object
  required:
    - version
    - destinationEnvironmentUri
    - encryptedContents
  properties:
    version:
      description: Activation key version. Must be `2` for this variant.
      type: integer
      format: int32
      enum: [2]
    encryptedContents:
      description: |-
        Required. Base64-encoded ciphertext containing the encrypted inner
        payload. The payload is encrypted using the destination environment's
        public key (obtained via GetActivationKeyParameters). After
        decryption, the plaintext is a JSON object conforming to
        ActivationKeyEncryptedPayload.
      type: string
      format: byte

ActivationKeyEncryptedPayload:
  description: |-
    The plaintext JSON structure contained within the `encryptedContents` field
    of a version 2 ActivationKey, after decryption. Contains all sensitive
    connection parameters that are not visible in the outer envelope.
  type: object
  required:
    - sharedConnectionUuid
    - connectionSizeMbps
    - destinationAccountId
    - sourceAccountId
  properties:
    sharedConnectionUuid:
      description: |-
        Required. The UUID assigned to this connection to be used by both
        services.
      type: string
    connectionSizeMbps:
      description: Required. Size of the connection to be provisioned in Mbps.
      type: integer
      format: int32
    destinationAccountId:
      description: |-
        Required. User supplied account id/number on the destination CSP.
        Receiving service MUST verify that the activation key was provided
        from an authorized user of this account.
      type: string
    sourceAccountId:
      description: |-
        Required. Account id/number of the originating (creating) provider's
        user on the source CSP. Introduced in version 2 activation keys.
      type: string

ConfirmActivationKeyResponse:
  description: |-
    Response from a provider about the validity of the key and any additional
    metadata that is needed for turn up.
  example:
    keyValid: true
  properties:
    keyValid:
      description: Indicates if the remote CSP believes this key is valid.
      type: boolean
  type: object

GetActivationKeyParametersResponse:
  description: |-
    Response describing the activation key parameters for an environment.
    Contains the supported activation key versions and encryption details
    (if the environment supports encrypted keys).
  type: object
  required:
    - supportedVersions
  properties:
    supportedVersions:
      description: |-
        The activation key versions this environment supports. The key creator
        should prefer the highest version number in this list. For example,
        `[1, 2]` indicates both plaintext and encrypted keys are accepted,
        with version 2 (encrypted) preferred.
      type: array
      items:
        type: integer
        format: int32
    encryption:
      allOf:
        - $ref: "#/EncryptionParameters"
      description: |-
        Encryption parameters for constructing a version 2 activation key.
        Present only when the environment supports version 2 keys. Absence of
        this field indicates the environment only supports version 1 (plaintext)
        keys.

EncryptionParameters:
  description: |-
    Encryption details required to construct a version 2 (encrypted) activation
    key. The key creator uses these parameters to encrypt the inner payload
    before constructing the activation key.
  type: object
  required:
    - publicKey
    - algorithm
    - keyFormat
  properties:
    publicKey:
      description: |-
        The PEM-encoded public key for encrypting activation key contents
        destined for this environment. Providers are recommended to rotate at
        least weekly, though the rotation cadence is ultimately agreed between
        the two partners based on their security needs. The environment accepts
        keys encrypted with any of the 4 most recent public keys.
      type: string
    nextRotationAt:
      description: |-
        The UTC timestamp at which this environment will next rotate its
        public/private key pair. Informs the caller when to fetch a fresh
        public key; a cached key remains usable until then. Optional -- absent
        if the environment does not expose a scheduled rotation time.
      type: string
      format: date-time
      example: "2026-09-08T00:00:00Z"
    algorithm:
      description: |-
        The asymmetric encryption algorithm to use when encrypting the inner
        payload with the provided public key.
      type: string
      example: "RSA-OAEP-256"
    keyFormat:
      description: The encoding format of the public key.
      type: string
      example: "PKCS8"