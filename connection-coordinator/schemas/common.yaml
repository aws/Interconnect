AdminState:
  description: |
    Enum that describes the admin state of a resource.
    ADMIN_STATE_ENABLED - A provider has administratively enabled a resource.
    ADMIN_STATE_DISABLED - A provider has administratively disabled a resource.
  enum:
  - ADMIN_STATE_ENABLED
  - ADMIN_STATE_DISABLED
  type: string

VerificationState:
  description: |-
    Enum that describes the verification state of a resource.
    VERIFICATION_STATE_UNVERIFIED - Verification is pending and not ready for production traffic.
    VERIFICATION_STATE_VERIFIED - Verification is complete and ready for production traffic.
  enum:
  - VERIFICATION_STATE_UNVERIFIED
  - VERIFICATION_STATE_VERIFIED
  type: string

ProvisioningState:
  description: |-
    Enum that describes the provisioning state of a resource.
    PROVISIONING_STATE_PENDING:
      1. Feature is created and parameters are reserved.

    PROVISIONING_STATE_FINAL:
      1. Configuration has propagated fully to the provider's infrastructure.
      2. Customer may send production traffic between providers using the
          feature.
  enum:
  - PROVISIONING_STATE_PENDING
  - PROVISIONING_STATE_FINAL
  type: string

Empty:
  description: |-
    A generic empty message that you can re-use to avoid defining duplicated
    empty messages in your APIs.
  type: object

ConnectionType:
  description: |-
    Enum that describes the type of a connection.
    CONNECTION_TYPE_STANDARD - Standard connections are ordinary customer
      connections.
    CONNECTION_TYPE_TEST - Test connections are reserved for provider
      development teams to support testing and canary workflows. Test
      connections may be provisioned at bandwidths below the minimum supported
      size (e.g. 50 Mbps). Bandwidth consumed by test connections must not
      count against interconnect or environment capacity totals. Partners may
      enforce a small quota on the number of active test connections.
    CONNECTION_TYPE_MONITORING - Monitoring connections are reserved for
      active monitoring sessions between providers. Monitoring connections may
      be provisioned at a small bandwidth and must not tally against
      interconnect or environment capacity totals. The quota is 2 per
      interconnect (not per environment), one created by each provider, to
      enable monitoring across all underlying links from either side. A
      monitoring connection may not have a customer resource or key associated
      with it. The local provider may apply provider-specific routing behavior
      to enable the agreed-upon monitoring for the remote provider; the exact
      routing configuration is left to each provider.
  enum:
  - CONNECTION_TYPE_STANDARD
  - CONNECTION_TYPE_TEST
  - CONNECTION_TYPE_MONITORING
  type: string