AllFeatures:
  get:
    description: List all features associated with a given connection.
    operationId: ListFeatures
    parameters:
    - $ref: "../parameters/_index.yaml#/parameters/x-request-id"
    - $ref: "../parameters/_index.yaml#/parameters/provider"
    - $ref: "../parameters/_index.yaml#/parameters/environment"
    - $ref: "../parameters/_index.yaml#/parameters/interconnect"
    - $ref: "../parameters/_index.yaml#/parameters/connection"
    - description: |-
        The maximum number of features to return. The service may return fewer
        than this value.
      explode: true
      in: query
      name: pageSize
      required: false
      schema:
        format: int32
        type: integer
      style: form
    - description: |-
        A page token, received from a previous `ListFeatures` call.
        Provide this to retrieve the subsequent page.

        When paginating, all other parameters provided to `ListFeatures` must
        match the call that provided the page token.
      explode: true
      in: query
      name: pageToken
      required: false
      schema:
        type: string
      style: form
    responses:
      default:
        content:
          application/json:
            schema:
              $ref: "../schemas/feature.yaml#/ListFeaturesResponse"
        description: Successful operation
    security: []
    tags:
    - Features
  post:
    description: |-
      Create a new feature associated with a connection.

      Multiple feature creation requests for the same resource may be sent by a
      remote provider simultaneously.  The server provider must ensure that any
      resource reservations are performed sequentially across those requests to
      prevent race conditions.

      Typical feature creation flow:

      1. Create server connection.
      2. Request feature guidance for connection.
      3. Select desired configuration parameters from guidance and create local
      feature.
      4. Create server feature.
      5. Await finalization.

      If *any* errors occur in the described flow, the remote provider is
      responsible for reconciling the server's state to determine if an existing
      request is in flight, retrying the provisioning flow with bounded retries
      (exponential backoff + jitter), retrying with new parameters when needed,
      or cleaning up resources and rejecting the customer's provisioning request.

      Errors:
        409: CONFLICT. Returned when a server detects concurrent updates to the
        resource.

        409: CONFLICT. Providers SHOULD enforce that at most one
        FEATURE_TYPE_L3_BASE Feature exists per (connection, channel). Attempts
        to create a second L3_BASE feature for the same (connection, channel)
        SHOULD be rejected with 409.
    operationId: CreateFeature
    parameters:
    - $ref: "../parameters/_index.yaml#/parameters/x-request-id"
    - $ref: "../parameters/_index.yaml#/parameters/provider"
    - $ref: "../parameters/_index.yaml#/parameters/environment"
    - $ref: "../parameters/_index.yaml#/parameters/interconnect"
    - $ref: "../parameters/_index.yaml#/parameters/connection"
    - description: |-
        Required. The ID to use for the feature, which will become the final component of
        the feature's resource name.

        Feature IDs MUST be treated as opaque identifiers. UUIDv4 is RECOMMENDED.
        Callers SHOULD persist feature IDs locally to allow reliable reconciliation and
        delete operations.
      explode: true
      in: query
      name: featureId
      required: true
      schema:
        type: string
      style: form
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../schemas/feature.yaml#/Feature"
      description: Required. The feature to create.
    responses:
      default:
        content:
          application/json:
            schema:
              $ref: "../schemas/feature.yaml#/Feature"
        description: Successful operation
    security: []
    tags:
    - Features
OneFeature:
  delete:
    description: Delete a specific feature.
    operationId: DeleteFeature
    parameters:
    - $ref: "../parameters/_index.yaml#/parameters/x-request-id"
    - $ref: "../parameters/_index.yaml#/parameters/provider"
    - $ref: "../parameters/_index.yaml#/parameters/environment"
    - $ref: "../parameters/_index.yaml#/parameters/interconnect"
    - $ref: "../parameters/_index.yaml#/parameters/connection"
    - $ref: "../parameters/_index.yaml#/parameters/feature"
    responses:
      default:
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Empty"
        description: Successful operation
    security: []
    tags:
    - Features
  get:
    description: Get details about a specific feature.
    operationId: GetFeature
    parameters:
    - $ref: "../parameters/_index.yaml#/parameters/x-request-id"
    - $ref: "../parameters/_index.yaml#/parameters/provider"
    - $ref: "../parameters/_index.yaml#/parameters/environment"
    - $ref: "../parameters/_index.yaml#/parameters/interconnect"
    - $ref: "../parameters/_index.yaml#/parameters/connection"
    - $ref: "../parameters/_index.yaml#/parameters/feature"
    responses:
      default:
        content:
          application/json:
            schema:
              $ref: "../schemas/feature.yaml#/Feature"
        description: Successful operation
    security: []
    tags:
    - Features
  patch:
    description: |-
      Update a specific feature's attributes.

      Not all feature types support updates. If UpdateFeature is called on a
      feature whose type does not support updates, or whose provider has
      declared it non-updatable, the server must return 405 METHOD NOT ALLOWED.

      When calling this API, the remote provider should update their local
      feature state before requesting an update to the server provider resource.

      Errors:
        405: METHOD_NOT_ALLOWED. Returned when the feature type does not support
        updates or the provider has declared the feature non-updatable.
        409: CONFLICT. Returned when a server detects concurrent updates to the
        resource.
    operationId: UpdateFeature
    parameters:
    - $ref: "../parameters/_index.yaml#/parameters/provider"
    - $ref: "../parameters/_index.yaml#/parameters/environment"
    - $ref: "../parameters/_index.yaml#/parameters/interconnect"
    - $ref: "../parameters/_index.yaml#/parameters/connection"
    - $ref: "../parameters/_index.yaml#/parameters/feature"
    - description: The list of fields to update.
      explode: true
      in: query
      name: updateMask
      required: false
      schema:
        format: fieldmask
        pattern: "^(\\s*[^,\\s.]+(\\s*[,.]\\s*[^,\\s.]+)*)?$"
        type: string
      style: form
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../schemas/feature.yaml#/Feature"
      description: Required. The feature to update.
    responses:
      default:
        content:
          application/json:
            schema:
              $ref: "../schemas/feature.yaml#/Feature"
        description: Successful operation
      "405":
        description: |-
          METHOD_NOT_ALLOWED. The feature type does not support updates or the
          provider has declared the feature non-updatable.
    security: []
    tags:
    - Features
